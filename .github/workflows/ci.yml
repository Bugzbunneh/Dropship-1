name: CI

on:
  # Every branch push, so a result arrives without opening a pull request first.
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Which store config the storefront build, smoke test and browser tests use.
      STORE: pet-pilot
      # Serve the built-in demo catalog, so CI needs no database or credentials. The live-database
      # checks (`pnpm check:live`, `pnpm db:check-remote`) run from a developer machine instead.
      CATALOG_SOURCE: fixtures
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Includes the tenant-isolation tests, which run migrations against an embedded Postgres.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Boots the built storefront from its store config and exercises the revalidation round trip.
      - name: Smoke test
        run: pnpm smoke

      - name: Install browser for end-to-end tests
        run: pnpm --filter @dropship/storefront exec playwright install --with-deps chromium

      # Browses, searches, filters and buys through the production build on a desktop and a phone,
      # with accessibility, search-engine and mobile-layout checks.
      - name: End-to-end tests
        run: pnpm e2e

      - name: Keep the end-to-end report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/storefront/playwright-report
          retention-days: 7
